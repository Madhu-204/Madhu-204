<svg xmlns="http://www.w3.org/2000/svg" width="480" height="130" viewBox="0 0 480 130">
  <style>
    .num { fill: #39d353; font-size: 36px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; }
    .label { fill: #8b949e; font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #e6edf3; font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; }
  </style>
  <rect width="480" height="130" rx="6" ry="6" fill="#0d1117"/>
  <text x="240.0" y="18" class="title" text-anchor="middle">GitHub Streak</text>
  <g transform="translate(0, 20)">
    <text x="80" y="30" class="num" text-anchor="middle">3</text>
    <text x="80" y="52" class="label" text-anchor="middle">Current Streak</text>
  </g>
  <g transform="translate(160, 20)">
    <text x="80" y="30" class="num" text-anchor="middle">3</text>
    <text x="80" y="52" class="label" text-anchor="middle">Longest Streak</text>
  </g>
  <g transform="translate(320, 20)">
    <text x="80" y="30" class="num" text-anchor="middle">84</text>
    <text x="80" y="52" class="label" text-anchor="middle">Total Contributions</text>
  </g>
</svg>